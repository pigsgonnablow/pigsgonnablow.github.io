<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>LMNOP Games</title>
  <meta name="description" content="LMNOP Games is an independent game studio. Play our games and prototypes.">
  <meta name="theme-color" content="#121316">
  <link rel="canonical" href="https://lmnop.games/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lmnop.games/">
  <meta property="og:site_name" content="LMNOP Games">
  <meta property="og:title" content="LMNOP Games">
  <meta property="og:description" content="Independent games and prototypes.">
  <meta property="og:image" content="https://lmnop.games/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LMNOP Games logo">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1 class="title"><img class="logo" src="assets/logo.svg" alt="LMNOP Games"></h1>
    <p class="tagline">Independent games and prototypes.</p>
  </header>

  <main>
    <section id="games" class="games">
      <div class="section-head">
        <h2>Games</h2>
        <div class="filters" role="group" aria-label="Filter games"></div>
      </div>
      <div class="grid" id="grid"></div>
      <noscript>
        <!-- Keep in step with games.js: shown to visitors and crawlers without JavaScript. -->
        <ul class="nojs">
          <li><a href="https://www.pigsgonnablow.com">Pigs Gonna Blow!</a>: Pop pigs, unlock skins, and climb the leaderboard.</li>
          <li><a href="https://lmnop.games/bandwick/">Bandwick</a> (prototype): Watch a band of people settle a wild island as they forage, build, feud and split into new bands.</li>
          <li><a href="https://lmnop.games/pigsmmo/">Forest Sim</a> (prototype): Wander a low-poly forest, gather sticks, grass and ore, and craft your first tools.</li>
          <li><a href="https://lmnop.games/driftspan/">Driftspan</a> (prototype): Lay bridges between drifting islands, gather wood and stone, and raise temples to claim new land.</li>
          <li><a href="https://lmnop.games/sdrHam/">Waterfall Radio</a> (prototype): Spin a globe of real radio receivers, see the airwaves as a 3D landscape, and tune in live anywhere on Earth.</li>
        </ul>
      </noscript>
    </section>
  </main>

  <footer>
    <p>© <span id="year">2026</span> LMNOP Games</p>
  </footer>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
