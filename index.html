<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMNOP Games</title>
  <meta name="description" content="LMNOP Games is an independent game studio. Play our games and prototypes.">
  <meta name="theme-color" content="#121316">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="LMNOP Games">
  <meta property="og:description" content="Independent games and prototypes.">
  <meta property="og:image" content="https://lmnop.games/assets/og.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img class="logo" src="assets/logo.svg" alt="LMNOP Games">
    <p class="tagline">Independent games and prototypes.</p>
  </header>

  <main>
    <section id="games" class="games">
      <div class="section-head">
        <h2>Games</h2>
        <div class="filters" role="tablist" aria-label="Filter games"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> LMNOP Games</p>
  </footer>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
